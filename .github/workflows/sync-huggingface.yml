name: Sync backend to Hugging Face Space

on:
  push:
    branches: [hf-free-cloud]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload app to Hugging Face Space
        uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: yushhh/ai-youtube-shorts-backend
          hf_token: ${{ secrets.HF_TOKEN }}
